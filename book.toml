[book]
title = "Habeas Codicem"
language = "en"
# {impl}`requirements.layout.project`
src = "md"

[preprocessor.habeas]
# {impl}`requirements.cli.mdbook`
# {impl}`requirements.layout.project`
command = "cargo habeas mdbook"
renderers = ["html"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
after = ["habeas"]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js", "md/mermaid-expand.js"]
additional-css = ["md/habeas.css", "md/intro.css", "md/mermaid-expand.css"]
# {impl}`requirements.integration.ci`
site-url = "/habeas-codicem/"
# {impl}`requirements.layout.repository_links`
git-repository-url = "https://github.com/nikomatsakis/habeas-codicem"
# {impl}`requirements.layout.repository_links`
edit-url-template = "https://github.com/nikomatsakis/habeas-codicem/edit/main/{path}"

[output.html.fold]
enable = true
level = 0
