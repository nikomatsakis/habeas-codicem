[book]
title = "Habeas Codicem"
language = "en"
# {impl}`requirements.layout.project`
src = "md"

[preprocessor.habeas]
# {impl}`requirements.cli.mdbook`
# {impl}`requirements.layout.project`
command = "cargo habeas mdbook"
renderers = ["habeas"]

[preprocessor.habeas.rustdocs]
# {impl}`requirements.index.rustdocs.publication`
path = "target/doc"
crate = "habeas_sdk"

[preprocessor.mermaid]
command = "mdbook-mermaid"
after = ["habeas"]
renderers = ["habeas"]

[output.habeas]
command = "./target/release/habeas mdbook render"

[output.habeas.html]
additional-js = ["mermaid.min.js", "mermaid-init.js", "md/mermaid-expand.js"]
additional-css = ["md/habeas.css", "md/intro.css", "md/mermaid-expand.css"]
# {impl}`requirements.integration.ci`
site-url = "/habeas-codicem/"
# {impl}`requirements.layout.repository_links`
git-repository-url = "https://github.com/nikomatsakis/habeas-codicem"
# {impl}`requirements.layout.repository_links`
edit-url-template = "https://github.com/nikomatsakis/habeas-codicem/edit/main/{path}"

[output.habeas.html.fold]
enable = true
level = 0

[output.habeas.html.redirect]
"requirements/sdk/graph/execution.html" = "validation.html#execute-the-criterion-with-a-context"

[output.habeas.html.search.chapter]
# Index authored chapters. Generated reports and evidence can be large;
# they remain available through the requirement and coverage indexes.
# Keep the enabled source paths in sync with md/SUMMARY.md.
"" = { enable = false }
"intro.md" = { enable = true }
"getting_started.md" = { enable = true }
"reference.md" = { enable = true }
"requirements.md" = { enable = true }
"requirements" = { enable = true }
"requirements-index.md" = { enable = true }
