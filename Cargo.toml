[package]
name = "habeas"
version = "0.2.0"
authors = ["Niko Matsakis"]
edition = "2024"
description = "Requirement evidence for mdBook and Cargo projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikomatsakis/habeas-codicem"
readme = "README.md"
keywords = ["requirements", "traceability", "evidence", "mdbook"]
categories = ["development-tools", "command-line-utilities"]

# The crate's Rust source lives in `src/`.
[lib]
# {impl}`requirements.layout.project`
path = "src/lib.rs"

[[bin]]
name = "habeas"
# {impl}`requirements.layout.project`
path = "src/main.rs"

[package.metadata.symposium]
# {impl}`requirements.integration.symposium`
name = "habeas"

[package.metadata.symposium.defaults]
# {impl}`requirements.integration.symposium`
skills = false

[[package.metadata.symposium.skills]]
# {impl}`requirements.integration.symposium`
source.path = "assets/skills"

[[package.metadata.symposium.installations]]
# {impl}`requirements.integration.symposium_cli`
name = "habeas"
source = "cargo"
crate = "habeas"
executable = "habeas"
global = true

[[package.metadata.symposium.hooks]]
# {impl}`requirements.integration.symposium_cli`
# {impl}`requirements.integration.symposium_setup_hook`
name = "habeas-setup-check"
event = "SessionStart"
format = "symposium"
command = "habeas"
args = ["hook", "session-start"]

[dependencies]
# Pinned exactly: a new version may change structural-search matches.
# {impl}`requirements.references.distributed`
# {impl}`requirements.authoring.structural_search`
ast-grep-config = "=0.51.1"
ast-grep-core = "=0.51.1"
aws-config = "=1.8.13"
aws-sdk-bedrockruntime = "1.153"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
fastrand = "2.5.0"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
httpdate = "1.0.3"
ignore = "0.4.34"
indicatif = "0.18.4"
mdbook-preprocessor = "=0.5.3"
pulldown-cmark = "=0.11.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rig-bedrock = "0.44"
rig-core = { version = "0.44", features = ["reqwest"] }
# Pinned exactly: a new version may change redaction and structural hashes.
# {impl}`requirements.authoring.redaction`
secretshape = "=0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "sync", "time"] }
toml = "1.2.0"
toml_edit = "0.25.17"
tree-sitter = "=0.27.1"
tree-sitter-css = "=0.25.0"
tree-sitter-md = "=0.5.4"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

# Patched to place prompt-cache checkpoints after reasoning turns, which
# Bedrock accepts; see vendor/rig-bedrock/src/request.rs.
[patch.crates-io]
rig-bedrock = { path = "vendor/rig-bedrock" }
