[workspace]
# {impl}`requirements.layout.project.workspace`
members = ["crates/trust-but-verify"]
resolver = "3"

[package]
name = "habeas"
version = "0.2.0"
authors = ["Niko Matsakis"]
edition = "2024"
description = "Requirement evidence for mdBook and Cargo projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikomatsakis/habeas-codicem"
readme = "README.md"
keywords = ["requirements", "traceability", "evidence", "mdbook"]
categories = ["development-tools", "command-line-utilities"]
# Repository assessments are not runtime assets; their selectors can contain
# characters Cargo does not permit in a published package.
exclude = ["evidence/**"]

# The crate's Rust source lives in `src/`.
[lib]
# {impl}`requirements.layout.project`
path = "src/lib.rs"

[[bin]]
name = "habeas"
# {impl}`requirements.layout.project`
path = "src/main.rs"

[package.metadata.symposium]
# {impl}`requirements.integration.symposium`
name = "habeas"

[package.metadata.symposium.defaults]
# {impl}`requirements.integration.symposium`
skills = false

[[package.metadata.symposium.skills]]
# {impl}`requirements.integration.symposium`
source.path = "assets/skills"

[[package.metadata.symposium.installations]]
# {impl}`requirements.integration.symposium_cli`
name = "habeas"
# {impl}`requirements.integration.symposium_cli`
source = "cargo"
# {impl}`requirements.integration.symposium_cli`
crate = "habeas"
executable = "habeas"
# {impl}`requirements.integration.symposium_cli`
global = true

[[package.metadata.symposium.hooks]]
# {impl}`requirements.integration.symposium_cli`
# {impl}`requirements.integration.symposium_setup_hook`
name = "habeas-setup-check"
# {impl}`requirements.integration.symposium_setup_hook`
event = "SessionStart"
# {impl}`requirements.integration.symposium_setup_hook`
format = "symposium"
# {impl}`requirements.integration.symposium_cli`
command = "habeas"
args = ["hook", "session-start"]

[dependencies]
trust-but-verify = { path = "crates/trust-but-verify", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
futures-executor = "0.3"
fastrand = "2.5.0"
git2 = { version = "0.21.0", default-features = false }
glob = "0.3.4"
ignore = "0.4.34"
indicatif = "0.18.4"
mdbook-preprocessor = "=0.5.3"
mdbook-html = { version = "=0.5.4", features = ["search"] }
mdbook-renderer = "=0.5.4"
pulldown-cmark = "=0.11.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
same-file = "1.0.6"
schemars = "1.2.3"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "sync", "time"] }
toml = "1.2.0"
toml_edit = "0.25.17"
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
uuid = { version = "1.29.2", features = ["v4"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
aws-config = "=1.8.13"
aws-sdk-bedrockruntime = "1.153"
rusqlite = { version = "0.43.0", features = ["trace"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
