[workspace]
# {impl}`requirements.layout.project.workspace`
members = ["crates/*"]
exclude = ["vendor/habeas-rig"]
resolver = "3"

[package]
name = "habeas"
version = "0.2.0"
authors = ["Niko Matsakis"]
edition = "2024"
description = "Requirement evidence for mdBook and Cargo projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikomatsakis/habeas-codicem"
readme = "README.md"
keywords = ["requirements", "traceability", "evidence", "mdbook"]
categories = ["development-tools", "command-line-utilities"]

# The crate's Rust source lives in `src/`.
[lib]
# {impl}`requirements.layout.project`
path = "src/lib.rs"

[[bin]]
name = "habeas"
# {impl}`requirements.layout.project`
path = "src/main.rs"

[package.metadata.symposium]
# {impl}`requirements.integration.symposium`
name = "habeas"

[package.metadata.symposium.defaults]
# {impl}`requirements.integration.symposium`
skills = false

[[package.metadata.symposium.skills]]
# {impl}`requirements.integration.symposium`
source.path = "assets/skills"

[[package.metadata.symposium.installations]]
# {impl}`requirements.integration.symposium_cli`
name = "habeas"
source = "cargo"
crate = "habeas"
executable = "habeas"
global = true

[[package.metadata.symposium.hooks]]
# {impl}`requirements.integration.symposium_cli`
# {impl}`requirements.integration.symposium_setup_hook`
name = "habeas-setup-check"
event = "SessionStart"
format = "symposium"
command = "habeas"
args = ["hook", "session-start"]

[dependencies]
habeas-sdk = { path = "crates/habeas-sdk", version = "0.1.0", features = ["default-languages"] }
aws-config = "=1.8.13"
aws-sdk-bedrockruntime = "1.153"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
fastrand = "2.5.0"
httpdate = "1.0.3"
ignore = "0.4.34"
indicatif = "0.18.4"
mdbook-preprocessor = "=0.5.3"
pulldown-cmark = "=0.11.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Temporary fork of rig-bedrock 0.44.0 (vendor/habeas-rig): it places prompt-cache
# checkpoints after reasoning turns, which upstream refuses but Bedrock accepts.
# Switch back to `rig-bedrock` once upstream fixes this.
rig-bedrock = { package = "habeas-rig", path = "vendor/habeas-rig", version = "0.44.0" }
rig-core = { version = "0.44", features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "sync", "time"] }
toml = "1.2.0"
toml_edit = "0.25.17"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
