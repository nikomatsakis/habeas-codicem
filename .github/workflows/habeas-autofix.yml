name: Habeas autofix experiment

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: habeas-autofix-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      base_sha: ${{ steps.select.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Create controller token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HABEAS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HABEAS_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-members: ${{ github.event.repository.owner.type == 'Organization' && 'read' || '' }}
      - name: Select authorized input
        id: select
        run: node .github/scripts/autofix.mjs prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
      - name: Save selected input
        if: steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autofix-plan
          path: |
            ${{ runner.temp }}/autofix/plan.json
            ${{ runner.temp }}/autofix/prompt.md
          if-no-files-found: error
          retention-days: 1

  agent:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autofix-plan
          path: ${{ runner.temp }}/autofix
      - name: Place prompt in checkout
        run: cp "$RUNNER_TEMP/autofix/prompt.md" .autofix-prompt.md
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.4 --no-default-features --features search
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: Run Habeas SOP
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .autofix-prompt.md
          output-file: .autofix-result.md
          permission-profile: ':workspace'
          codex-args: '["-c", "web_search=\"disabled\""]'
      - name: Capture patch
        run: |
          mv -- .autofix-result.md "$RUNNER_TEMP/autofix/result.md"
          rm -- .autofix-prompt.md
          git add -N -A
          git diff HEAD --binary > "$RUNNER_TEMP/autofix/changes.patch"
      - name: Save patch
        uses: actions/upload-artifact@v4
        with:
          name: autofix-patch
          path: |
            ${{ runner.temp }}/autofix/changes.patch
            ${{ runner.temp }}/autofix/result.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: autofix-plan
          path: ${{ runner.temp }}/autofix
      - uses: actions/download-artifact@v4
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix
      - name: Create publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HABEAS_APP_CLIENT_ID }}
          private-key: ${{ secrets.HABEAS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-members: ${{ github.event.repository.owner.type == 'Organization' && 'read' || '' }}
      - name: Recheck state and publish
        run: node .github/scripts/autofix.mjs publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
