[package]
name = "habeas-languages"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Extensible source language support for Habeas"
repository = "https://github.com/nikomatsakis/habeas-codicem"

[dependencies]
habeas-language = { path = "../habeas-language", version = "0.1.0" }
habeas-language-rust = { path = "../habeas-language-rust", version = "0.1.0" }
habeas-language-python = { path = "../habeas-language-python", version = "0.1.0" }
habeas-language-typescript = { path = "../habeas-language-typescript", version = "0.1.0" }
habeas-language-css = { path = "../habeas-language-css", version = "0.1.0" }
habeas-language-markdown = { path = "../habeas-language-markdown", version = "0.1.0" }
habeas-language-toml = { path = "../habeas-language-toml", version = "0.1.0" }
habeas-language-yaml = { path = "../habeas-language-yaml", version = "0.1.0" }
