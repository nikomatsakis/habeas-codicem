[package]
# {impl}`requirements.layout.project`
name = "trust-but-verify"
version = "0.1.1"
authors = ["Niko Matsakis"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Build source-code checks that track the evidence behind each result"
repository = "https://github.com/nikomatsakis/habeas-codicem"
documentation = "https://docs.rs/trust-but-verify"
readme = "README.md"
keywords = ["verification", "evidence", "traceability", "static-analysis"]
categories = ["development-tools", "development-tools::testing"]

[dependencies]
indexmap = "2"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
aws-config = "=1.8.13"
aws-sdk-bedrockruntime = "1.153"
rig-bedrock = "0.47.1"
futures = "0.3.34"
fastrand = "2.5.0"
httpdate = "1.0.3"
rig-core = { version = "0.47.1", features = ["reqwest"] }
# Grammar, search, and redaction versions are pinned to preserve fingerprints.
# {impl}`requirements.references.distributed`
# {impl}`requirements.authoring.structural_search`
ast-grep-config = "=0.51.1"
ast-grep-core = "=0.51.1"
regex = "1.13.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
# {impl}`requirements.authoring.redaction`
secretshape = "=0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
# Preserve the JSON serialization used in stored evidence and fingerprints.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = "1.2.3"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }
toml = "1.2.0"
toml_edit = "0.25.17"
# {impl}`requirements.references.outlines`
tree-sitter = "=0.27.1"
# {impl}`requirements.references.outlines`
tree-sitter-css = "=0.25.0"
# {impl}`requirements.references.outlines`
tree-sitter-md = "=0.5.4"
# {impl}`requirements.references.outlines`
tree-sitter-python = "=0.25.0"
# {impl}`requirements.references.outlines`
tree-sitter-rust = "=0.24.2"
# {impl}`requirements.references.outlines`
tree-sitter-toml-ng = "=0.7.0"
# {impl}`requirements.references.outlines`
tree-sitter-typescript = "=0.23.2"
# {impl}`requirements.references.outlines`
tree-sitter-yaml = "=0.7.2"
pulldown-cmark = "=0.11.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
