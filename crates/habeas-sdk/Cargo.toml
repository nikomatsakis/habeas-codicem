[package]
name = "habeas-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Source outlines, redaction, access control, and search for evidence tooling"
repository = "https://github.com/nikomatsakis/habeas-codicem"

[dependencies]
# Grammar, search, and redaction versions are pinned to preserve fingerprints.
# {impl}`requirements.references.distributed`
# {impl}`requirements.authoring.structural_search`
ast-grep-config = "=0.51.1"
ast-grep-core = "=0.51.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
# {impl}`requirements.authoring.redaction`
secretshape = "=0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1.2.0"
toml_edit = "0.25.17"
tree-sitter = "=0.27.1"
tree-sitter-css = "=0.25.0"
tree-sitter-md = "=0.5.4"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
